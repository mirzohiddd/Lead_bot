    <!-- Optimized font loading -->

      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&subset=cyrillic,cyrillic-ext,latin&display=swap"

      />
    </noscript>

    <!-- Meta Pixel Code -->
    <script>
      !function(f,b,e,v,n,t,s)
      {
        if(f.fbq)return;

        n=f.fbq=function(){
          n.callMethod
            ? n.callMethod.apply(n,arguments)
            : n.queue.push(arguments)
        };

        if(!f._fbq)f._fbq=n;

        n.push=n;
        n.loaded=!0;
        n.version='2.0';
        n.queue=[];

        t=b.createElement(e);
        t.async=!0;
        t.src=v;

        s=b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t,s);

      }(
        window,
        document,
        'script',
        'https://connect.facebook.net/en_US/fbevents.js'
      );

      // Meta Pixel ID
      var gpPixelId = '1556385933212613';

      // Avtomatik event aniqlashni o'chirish
      // CTA hodisalari Vue orqali boshqariladi
      fbq('set', 'autoConfig', false, gpPixelId);

      // Tracking roziligini tekshirish
      var gpNeedConsent =
        '%VITE_TRACKING_CONSENT%' === 'required';

      var gpConsent = null;

      try {
        gpConsent = localStorage.getItem(
          'gp_tracking_consent'
        );
      } catch (e) {
        gpConsent = null;
      }

      // Rozilik talab qilinganda trackingni bloklash
      if (gpNeedConsent && gpConsent !== 'granted') {
        fbq('consent', 'revoke');
      }

      // Meta Pixel initialization
      fbq('init', gpPixelId);

      // PageView faqat bir marta yuboriladi
      if (
        (!gpNeedConsent || gpConsent === 'granted') &&
        !window.__gpPageViewSent
      ) {
        fbq('track', 'PageView');

        window.__gpPageViewSent = true;
      }
    </script>
    <!-- End Meta Pixel Code -->

  </head>
